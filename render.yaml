services:
  # -------------------------------------------------------------
  # 1. DevMentor AI Backend (Express API)
  # -------------------------------------------------------------
  - type: web
    name: devmentorai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_SERVICE_URL
        value: http://devmentorai-ml:8000

  # -------------------------------------------------------------
  # 2. DevMentor AI ML Service (FastAPI Server via Docker)
  # -------------------------------------------------------------
  - type: web
    name: devmentorai-ml
    env: docker
    plan: free
    rootDir: ml-service
